name: Sync MyClash with Smart

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync and patch upstream script
        run: |
          python3 - <<'PY'
          import urllib.request
          import pathlib
          import re

          url = "https://raw.githubusercontent.com/AIsouler/MyClash/main/Script/mihomoScript.js"
          req = urllib.request.Request(url, headers={"User-Agent": "GitHub-Actions"})
          content = urllib.request.urlopen(req).read().decode("utf-8")

          # 原地将自动选择策略组改为 Smart，不新增代理组。
          pattern = re.compile(
              r"(const urlTestBaseOption\s*=\s*\{\s*"
              r"\.\.\.groupBaseOption,\s*"
              r"type:\s*)['\"]url-test['\"]"
              r"([,]\s*\n)"
              r"(\s*tolerance:\s*[^,\n]+,\s*\n)?"
          )
          content, count = pattern.subn(r"\1'smart'\2", content, count=1)

          if count == 0:
              smart_pattern = re.compile(
                  r"(const urlTestBaseOption\s*=\s*\{\s*"
                  r"\.\.\.groupBaseOption,\s*"
                  r"type:\s*['\"]smart['\"],\s*\n)"
                  r"\s*tolerance:\s*[^,\n]+,\s*\n"
              )
              content, removed = smart_pattern.subn(r"\1", content, count=1)
              if removed != 1:
                  # 上游已是干净的 Smart 配置时允许继续同步。
                  if not re.search(
                      r"const urlTestBaseOption\s*=\s*\{\s*"
                      r"\.\.\.groupBaseOption,\s*"
                      r"type:\s*['\"]smart['\"]",
                      content
                  ):
                      raise RuntimeError("未找到预期的 urlTestBaseOption 配置，停止更新")

          # 同步将基础组、极简模式组及其引用改为新名称。
          # 地区自动选择组名称同步改为“地区-Smart智能选点”。
          content, region_count = re.subn(
              r"\$\{name\}-自动选择",
              "${name}-Smart智能选点",
              content
          )
          if region_count < 1:
              raise RuntimeError("未找到地区自动选择组名称模板，停止更新")
          content, group_count = re.subn(
              r"name:\s*(['\"])自动选择\1",
              "name: 'Smart智能选点'",
              content
          )
          content, ref_count = re.subn(
              r"\[\s*(['\"])自动选择\1\s*\]",
              "['Smart智能选点']",
              content
          )
          if group_count < 2 or ref_count < 1:
              raise RuntimeError(
                  f"自动选择组名称替换数量异常：groups={group_count}, refs={ref_count}"
              )

          path = pathlib.Path("Script/mihomoScript.js")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(content, encoding="utf-8")
          print("同步完成：Smart 类型及 Smart智能选点名称已应用")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Script/mihomoScript.js

          if git diff --cached --quiet; then
            echo "没有新更新"
            exit 0
          fi

          git commit -m "Sync upstream MyClash with Smart"
          git push
