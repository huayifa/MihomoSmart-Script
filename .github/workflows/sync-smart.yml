
name: Sync MyClash with Smart

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync and patch upstream script
        run: |
          python3 - <<'PY'
          import urllib.request
          import pathlib
          import re

          url = "https://raw.githubusercontent.com/AIsouler/MyClash/main/Script/mihomoScript.js"
          req = urllib.request.Request(url, headers={"User-Agent": "GitHub-Actions"})
          content = urllib.request.urlopen(req).read().decode("utf-8")

          # 只修改自动选择公共配置，不改动其他代理组和分流规则。
          content, comment_count = re.subn(
              r"// url-test策略组通用配置",
              "// Smart 智能选点策略组通用配置",
              content,
              count=1
          )

          block_pattern = re.compile(
              r"(const urlTestBaseOption\\s*=\\s*\\{\\s*"
              r"\\.\\.\\.groupBaseOption,\\s*"
              r"type:\\s*)['\\"]url-test['\\"]"
              r"([,]\\s*\\n)"
              r"(\\s*tolerance:\\s*[^,\\n]+,\\s*\\n)?"
          )

          content, count = block_pattern.subn(
              r"\\1'smart'\\2",
              content,
              count=1
          )

          # 兼容上游已经被其他流程改成 smart 的情况，同时确保移除旧测速参数。
          if count == 0:
              smart_pattern = re.compile(
                  r"(const urlTestBaseOption\\s*=\\s*\\{\\s*"
                  r"\\.\\.\\.groupBaseOption,\\s*"
                  r"type:\\s*['\\"]smart['\\"],\\s*\\n)"
                  r"\\s*tolerance:\\s*[^,\\n]+,\\s*\\n"
              )
              content, removed = smart_pattern.subn(r"\\1", content, count=1)
              if removed != 1:
                  raise RuntimeError("未找到预期的 urlTestBaseOption 配置，停止更新")

          path = pathlib.Path("Script/mihomoScript.js")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(content, encoding="utf-8")
          print("同步完成：自动选择组使用 smart，已移除 tolerance 参数")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Script/mihomoScript.js

          if git diff --cached --quiet; then
            echo "没有新更新"
            exit 0
          fi

          git commit -m "Sync upstream MyClash with Smart"
          git push
